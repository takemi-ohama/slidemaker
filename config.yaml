# slidemaker configuration - Vertex AI Gemini (Improved Prompts)

llm:
  # Configuration for slide composition generation
  # Uses: Markdown → スライド構成生成 (テキスト処理のみ)
  # Model: Gemini 3 Pro Image Preview - 最先端の推論能力
  composition:
    type: api
    provider: vertex-gemini
    model: gemini-3-pro-image-preview
    extra_params:
      project_id: "${GOOGLE_CLOUD_PROJECT}"  # GCP Project ID (環境変数から取得)
      location: "global"  # グローバルロケーション
      api_version: "v1beta1"  # v1beta1 を使用
      use_global_endpoint: true  # グローバルエンドポイントを使用
      max_tokens: 8192
      temperature: 0.7
    timeout: 300

  # Configuration for image analysis
  # Uses: PDF/画像分析、テキスト・画像要素の検出・抽出 (Vision必要)
  # Model: Gemini 3 Pro Image Preview - 高精度な画像理解
  image_generation:
    type: api
    provider: vertex-gemini
    model: gemini-3-pro-image-preview
    extra_params:
      project_id: "${GOOGLE_CLOUD_PROJECT}"  # GCP Project ID (環境変数から取得)
      location: "global"  # グローバルロケーション
      api_version: "v1beta1"  # v1beta1 を使用
      use_global_endpoint: true  # グローバルエンドポイントを使用
      max_tokens: 8192
      temperature: 0.3  # 低temperature = 精度重視
    timeout: 300

output:
  directory: ./output
  temp_directory: ./tmp
  keep_temp: false

slide:
  default_size: "16:9"
  default_theme: "minimal"
  default_font: "Arial"

logging:
  level: INFO
  format: json
  file: null
